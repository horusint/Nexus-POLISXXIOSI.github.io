<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cyber Academy - Incident Response Portal</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-bg: #131c31;
            --primary: #00ff66;
            --accent: #00e5ff;
            --text: #ffffff;
            --text-muted: #8b9bb4;
            --danger: #ff0055;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); padding: 40px 20px; min-height: 100vh; }
        .wrapper { max-width: 1000px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--card-bg); padding-bottom: 20px; }
        h1 { color: var(--primary); text-transform: uppercase; font-weight: 800; text-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
        .subtitle { color: var(--accent); font-family: monospace; font-size: 1.1rem; margin-top: 5px; }

        .panel-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        .form-section, .score-section { background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { color: var(--accent); font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        
        input[type="text"], select { width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 1rem; }
        input[type="text"]:focus, select:focus { border-color: var(--accent); outline: none; }
        
        .radio-box { display: flex; gap: 15px; margin-top: 5px; }
        .radio-option { background: #000; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: monospace; font-size: 0.9rem; }
        .radio-option input { accent-color: var(--primary); }

        .btn-submit { width: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); color: #000; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.3s ease; margin-top: 10px; }
        .btn-submit:hover { box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); transform: translateY(-2px); }

        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; font-family: monospace; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--accent); text-transform: uppercase; font-size: 0.9rem; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .rank-1 { color: var(--primary); font-weight: bold; }

        .btn-clear { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; float: right; margin-top: -35px; }
        .btn-clear:hover { background: var(--danger); color: #fff; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Squad de Respuesta a Incidentes</h1>
            <div class="subtitle">[ NEXUS CYBER ACADEMY — CENTRAL CORE PLATFORM ]</div>
        </header>

        <div class="panel-grid">
            <!-- SECCIÓN FORMULARIO ALUMNOS -->
            <div class="form-section">
                <h2>Formulario de Misión Forense</h2>
                <form id="incidentForm" onsubmit="processReport(event)">
                    
                    <div class="form-group">
                        <label>Nombre del Squad de Operaciones:</label>
                        <input type="text" id="squadName" required placeholder="Ej: Polix XXI - Ciberpibes">
                    </div>

                    <div class="form-group">
                        <label>Reto 1: Dirección IPv4 Privada Detectada (Host Local):</label>
                        <input type="text" id="reto1" required placeholder="0.0.0.0">
                    </div>

                    <div class="form-group">
                        <label>Reto 2: Clasificación de Incidentes (Tríada CID):</label>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted);">• Alfa (Discord Caído):</span>
                                <div class="radio-box">
                                    <label class="radio-option"><input type="radio" name="cid1" value="C"> C</label>
                                    <label class="radio-option"><input type="radio" name="cid1" value="I"> I</label>
                                    <label class="radio-option"><input type="radio" name="cid1" value="D" required> D</label>
                                </div>
                            </div>
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted);">• Beta (Notas Alteradas):</span>
                                <div class="radio-box">
                                    <label class="radio-option"><input type="radio" name="cid2" value="C"> C</label>
                                    <label class="radio-option"><input type="radio" name="cid2" value="I" required> I</label>
                                    <label class="radio-option"><input type="radio" name="cid2" value="D"> D</label>
                                </div>
                            </div>
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted);">• Gamma (Código Exfiltrado):</span>
                                <div class="radio-box">
                                    <label class="radio-option"><input type="radio" name="cid3" value="C" required> C</label>
                                    <label class="radio-option"><input type="radio" name="cid3" value="I"> I</label>
                                    <label class="radio-option"><input type="radio" name="cid3" value="D"> D</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Reto 3: Contraseña Capturada en Texto Plano (Wireshark):</label>
                        <input type="text" id="reto3" required placeholder="Clave hallada en capa HTTP...">
                    </div>

                    <div class="form-group">
                        <label>Reto 5: Estampa de Tiempo del Ataque de Logs (HH:MM:SS):</label>
                        <input type="text" id="reto5" required placeholder="20:09:00">
                    </div>

                    <div class="form-group">
                        <label>Endgame Token: FLAG 1 (SQL Injection):</label>
                        <input type="text" id="flag1" placeholder="FLAG{...}">
                    </div>

                    <div class="form-group">
                        <label>Endgame Token: FLAG 2 (Path Traversal):</label>
                        <input type="text" id="flag2" placeholder="FLAG{...}">
                    </div>

                    <div class="form-group">
                        <label>Endgame Token: FLAG 3 (DOM Logic Tampering):</label>
                        <input type="text" id="flag3" placeholder="FLAG{...}">
                    </div>

                    <button type="submit" class="btn-submit">Enviar Reporte de Operaciones</button>
                </form>
            </div>

            <!-- SECCIÓN SCOREBOARD CENTRAL -->
            <div class="score-section">
                <h2>Scoreboard del Taller</h2>
                <button class="btn-clear" onclick="clearScoreboard()">Reiniciar</button>
                
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Squad Name</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboardBody">
                        <!-- Carga dinámica mediante JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        // Respuestas Correctas para Calificación en Tiempo Real
        const ANSWERS = {
            reto2: { c1: 'D', c2: 'I', c3: 'C' },
            reto3: "PasswordSuperSecret1#4",
            reto5: "22:11:00",
            flag1: "FLAG{SQL_BYPASS_MASTER}",
            flag2: "FLAG{FTP_EXFIL_SECURE}",
            flag3: "FLAG{DOM_LOGIC_EXPLOIT}"
        };

        function processReport(e) {
            e.preventDefault();
            const squad = document.getElementById('squadName').value.trim();
            if (!squad) return;

            let score = 0;

            // Validación Reto 1 (50 PTS directos por completar)
            const r1 = document.getElementById('reto1').value.trim();
            if(r1.length > 6) score += 50;

            // Validación Reto 2 (100 PTS totales)
            const c1 = document.querySelector('input[name="cid1"]:checked')?.value;
            const c2 = document.querySelector('input[name="cid2"]:checked')?.value;
            const c3 = document.querySelector('input[name="cid3"]:checked')?.value;
            if(c1 === ANSWERS.reto2.c1) score += 33;
            if(c2 === ANSWERS.reto2.c2) score += 33;
            if(c3 === ANSWERS.reto2.c3) score += 34;

            // Validación Reto 3 (200 PTS)
            const r3 = document.getElementById('reto3').value.trim();
            if(r3 === ANSWERS.reto3) score += 200;

            // Validación Reto 5 (100 PTS)
            const r5 = document.getElementById('reto5').value.trim();
            if(r5 === ANSWERS.reto5) score += 100;

            // Validación Banderas del CTF (150, 200 y 250 PTS respectivamente)
            const f1 = document.getElementById('flag1').value.trim();
            const f2 = document.getElementById('flag2').value.trim();
            const f3 = document.getElementById('flag3').value.trim();
            if(f1 === ANSWERS.flag1) score += 150;
            if(f2 === ANSWERS.flag2) score += 200;
            if(f3 === ANSWERS.flag3) score += 250;

            // Guardar o actualizar registro en localStorage local del navegador
            let currentLeaderboard = JSON.parse(localStorage.getItem('nexus_scoreboard')) || {};
            currentLeaderboard[squad] = score; 
            localStorage.setItem('nexus_scoreboard', JSON.stringify(currentLeaderboard));

            document.getElementById('incidentForm').reset();
            renderScoreboard();
            alert(`[+] Reporte del Squad "${squad}" procesado. Puntaje calculado: ${score} PTS.`);
        }

        function renderScoreboard() {
            const leaderboard = JSON.parse(localStorage.getItem('nexus_scoreboard')) || {};
            const tbody = document.getElementById('scoreboardBody');
            tbody.innerHTML = '';

            // Ordenar de mayor a menor puntuación de forma matemática
            const sorted = Object.entries(leaderboard).sort((a, b) => b - a);

            sorted.forEach(([squad, score], index) => {
                const tr = document.createElement('tr');
                if (index === 0) tr.classList.add('rank-1');
                
                tr.innerHTML = `
                    <td>#${index + 1}</td>
                    <td>${squad}</td>
                    <td><strong>${score} PTS</strong></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function clearScoreboard() {
            if(confirm('¿Deseas reiniciar por completo el Scoreboard del taller?')) {
                localStorage.removeItem('nexus_scoreboard');
                renderScoreboard();
            }
        }

        // Sincronizar datos entre pestañas abiertas en la misma laptop del profesor
        window.addEventListener('storage', renderScoreboard);

        // Renderizado inicial
        renderScoreboard();
    </script>
</body>
</html>
